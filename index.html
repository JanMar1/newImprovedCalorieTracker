<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#181818" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Calorie Tracker</title>
</head>
<body>
<div id="app">
  <section class="screen" id="screen_1">
    <!-- daily stats -->
    <section class="card">
      <div class="row">
        <div class="pair">
          <div class="stat">
            <span id="today_kcal"></span>
            <div class="stat-label"> kcal today</div>
          </div>

          <div class="divider"></div>

          <div class="stat">
            <span id="today_protein"></span>
            <div class="stat-label"> g of protein today</div>
          </div>
        </div>
      </div>
    </section>
    <!-- list of all entries of the day -->
    <section class="card list-card">
      <ul id="entry_list">12
      </ul>
    </section>


    <!-- input -->
    <section class="card">
      <div class="row">
      <label for="calories">calories</label>
      <input type="number" id="calories" value="550" step="50" max="5000" min="0" inputmode="numeric">
      </div>
      <div class="row">
      <label for="protein">protein</label>
      <input type="number" id="protein" value="0" step="1" max="500" min="0" inputmode="numeric">
      </div>
      <div class="row">
      <label for="note">note</label>
      <input type="text" id="note" maxlength="100">
      </div>
      <div class="row">
      <button class="button" id="add_button">Add</button>
      </div>
    </section>
  </section>

  <section class="screen" id="screen_2" hidden>
    <section class="card">
      Gewichte
    </section>
  </section>


  <section class="screen" id="screen_3" hidden>
    <section class="card">
      settings
      <div class="row">

        <button id="export_btn" class="settings_btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download preview-icon"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
        </button>

      </div>
      <div class="row">
        <button id="import_btn" class="settings_btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-upload preview-icon"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
        </button>
      </div>

    </section>
  </section>

</div>

<div class="divider_nav"></div>



<nav id="nav_bar">
  <button class="nav-button" data-screen="screen_1">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-utensils preview-icon"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
  </button>
  <button class="nav-button" data-screen="screen_2">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scale preview-icon"><path d="M12 3v18"/><path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/><path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M7 21h10"/></svg>
  </button>
  <button class="nav-button" data-screen="screen_3">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings preview-icon"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</nav>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
