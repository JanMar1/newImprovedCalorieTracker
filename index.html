<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#181818" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Calorie Tracker</title>
</head>
<body>
<div id="app">
  <section class="screen" id="screen_1">
    <!-- daily stats -->
    <section class="card">
      <div class="row">
        <div class="pair">
          <div class="stat">
            <span id="today_kcal"></span>
            <div class="stat-label"> kcal today</div>
          </div>

          <div class="divider"></div>

          <div class="stat">
            <span id="today_protein"></span>
            <div class="stat-label"> g of protein today</div>
          </div>
        </div>
      </div>
    </section>
    <!-- list of all entries of the day -->
    <section class="card list-card">
      <ul id="entry_list">
      </ul>
    </section>


    <!-- input -->
    <section class="card">
      <div class="row">
      <label for="calories">CALORIES</label>
      <input type="number" id="calories" value="550" step="50" max="5000" min="0" inputmode="numeric">
      </div>
      <div class="row">
      <label for="protein">PROTEIN</label>
      <input type="number" id="protein" value="0" step="1" max="500" min="0" inputmode="numeric">
      </div>
      <div class="row">
      <label for="note">NOTE</label>
      <input type="text" id="note" maxlength="100">
      </div>
      <div class="row">
      <button class="button" id="add_button">Add</button>
      </div>
    </section>
  </section>

  <section class="screen" id="screen_2" hidden>
  </section>

</div>



<nav id="nav_bar">
  <button class="nav-button" data-screen="main_1">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house preview-icon"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  </button>
  <button class="nav-button" data-screen="main_2">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chart-line preview-icon"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg>
  </button>
</nav>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
