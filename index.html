<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#181818" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Calorie Tracker</title>
</head>
<body>
<div id="app">
  <!-- daily stats -->
  <section class="card">
    <div class="row">
      <div class="pair">
        <div class="stat">
          <span id="today_kcal"></span>
          <div class="stat-label"> kcal today</div>
        </div>

        <div class="divider"></div>
        
        <div class="stat">
          <span id="today_protein"></span>
          <div class="stat-label"> g of protein today</div>
        </div>
      </div>
    </div>
  </section>
  <!-- list of all entries of the day -->
  <section class="card list-card">
    <ul id="entry_list">
    </ul>
  </section>


  <!-- input -->
  <section class="card">
    <div class="row">
    <label for="calories">CALORIES</label>
    <input type="number" id="calories" value="550" step="50" max="5000" min="0" inputmode="numeric">
    </div>
    <div class="row">
    <label for="protein">PROTEIN</label>
    <input type="number" id="protein" value="0" step="1" max="500" min="0" inputmode="numeric">
    </div>
    <div class="row">
    <label for="note">NOTE</label>
    <input type="text" id="note" maxlength="100">
    </div>
    <div class="row">
    <button class="button" id="add_button">Add</button>
    </div>
  </section>

</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
